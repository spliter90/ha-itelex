name: ZIP entpacken

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/zip-entpacken.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entpacken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP auspacken
        run: |
          set -e
          zip=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$zip" ]; then echo "Keine ZIP-Datei gefunden."; exit 0; fi
          rm -rf /tmp/zip && mkdir /tmp/zip
          unzip -q "$zip" -d /tmp/zip
          src=/tmp/zip
          [ -d /tmp/zip/ha-itelex ] && src=/tmp/zip/ha-itelex
          rm -rf "$src/.git"
          cp -a "$src"/. ./
          git rm -q -- "$zip"

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nichts zu tun."; exit 0; fi
          git commit -m "Add-on aus ZIP entpackt"
          git push
