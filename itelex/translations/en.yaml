configuration:
  nummer:
    name: Own telex number
    description: Number assigned by the i-Telex admins. Leave empty if you only send.
  kennung:
    name: Answerback
    description: Sent on WRU, e.g. "12345 chris d". Max. 20 characters.
  anrufer_kennung_abfragen:
    name: Ask caller's answerback
    description: Sends WRU on incoming calls to identify the sender (required for blocking by number).
  zustellung_bestaetigen:
    name: Confirm delivery
    description: Requests the remote answerback again after sending and marks the message as delivered.
  warten_auf_antwort:
    name: Wait for a reply after sending (seconds)
    description: How long the line stays open after your text in case the other side wants to reply (default 30). Once they start typing, the conversation timeout applies. 0 = hang up immediately.
  auflegen_nach_senden:
    name: Hang up during a conversation (seconds of silence)
    description: Once someone is typing, the line is closed after this much silence (default 120, max. 1800). Every character resets the timer. Also used for "Call".
  auflegen_eingehend:
    name: Hang up incoming calls (seconds)
    description: Hangs up when nothing was typed for this long on an incoming call. Normally the caller hangs up.
  dynamische_ip:
    name: Report dynamic IP to the subscriber server
    description: Reports the own IP hourly to the TNS. Only enable if the i-Telex admins set up a dynamic entry and gave you a PIN.
  tns_pin:
    name: PIN
    description: PIN for IP updates at the subscriber server and for logging in to an exchange.
  oeffentlicher_port:
    name: Public port
    description: Port reachable from the internet (router port forwarding).
  vermittlung:
    name: Exchange
    description: Hostname of an exchange the station logs in to (outgoing), e.g. your own i-Telex exchange. No port forwarding or public IP needed. Empty = off.
  vermittlung_port:
    name: Exchange port
    description: Default 49491.
  protokoll:
    name: Log level
    description: "debug writes every i-Telex packet to the add-on log (troubleshooting)."
  tns_server:
    name: Subscriber servers
    description: i-Telex directory servers (TNS), port 11811, queried in order. Put your own exchange first.
network:
  134/tcp: i-Telex (incoming calls)
