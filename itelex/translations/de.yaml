configuration:
  nummer:
    name: Eigene Telexnummer
    description: Die von den i-Telex-Admins vergebene Nummer. Leer lassen, solange du nur sendest.
  kennung:
    name: Kennung (Namengeber)
    description: Wird auf „Wer da?“ gesendet, z. B. „12345 chris d“. Höchstens 20 Zeichen.
  anrufer_kennung_abfragen:
    name: Kennung des Anrufers abfragen
    description: Sendet bei eingehenden Anrufen „Wer da?“, um den Absender zu erkennen (nötig für die Sperre per Nummer).
  zustellung_bestaetigen:
    name: Zustellung bestätigen
    description: Fragt nach dem Senden erneut die Kennung der Gegenstelle ab und markiert die Nachricht als zugestellt.
  auflegen_nach_senden:
    name: Auflegen nach dem Senden (Sekunden)
    description: So lange wartet die Leitung nach deinem Text auf eine Antwort (Standard 300 = 5 Minuten, höchstens 1800). Jedes getippte Zeichen setzt die Zeit zurück. 0 = sofort auflegen.
  auflegen_eingehend:
    name: Auflegen bei eingehenden Anrufen (Sekunden)
    description: Legt auf, wenn bei einem eingehenden Anruf so lange nichts getippt wurde. Normalerweise legt der Anrufer selbst auf.
  dynamische_ip:
    name: Dynamische IP beim Teilnehmerserver melden
    description: Meldet die eigene IP stündlich an den TNS. Nur einschalten, wenn die i-Telex-Admins den Eintrag als dynamisch angelegt und dir eine PIN gegeben haben.
  tns_pin:
    name: PIN
    description: PIN für die IP-Meldung beim Teilnehmerserver und für die Anmeldung an einer Vermittlung (von den i-Telex-Admins bzw. aus deiner eigenen Vermittlung).
  oeffentlicher_port:
    name: Öffentlicher Port
    description: Port, unter dem du aus dem Internet erreichbar bist (Portweiterleitung im Router).
  vermittlung:
    name: Vermittlung
    description: Hostname einer Vermittlung, an der sich die Station ausgehend anmeldet (z. B. deine eigene i-Telex-Vermittlung). Dann sind keine Portweiterleitung und keine öffentliche IP nötig. Leer = aus.
  vermittlung_port:
    name: Port der Vermittlung
    description: Standard 49491.
  protokoll:
    name: Protokollstufe
    description: "debug schreibt jedes i-Telex-Paket ins Add-on-Protokoll (zur Fehlersuche)."
  tns_server:
    name: Teilnehmerserver
    description: i-Telex-Teilnehmerverzeichnis (TNS), Port 11811. Wird der Reihe nach gefragt – eine eigene Vermittlung gehört an die erste Stelle.
network:
  134/tcp: i-Telex (eingehende Anrufe)
