# i-Telex-Vermittlung als eigenständiger Server (ohne Home Assistant).
# Start:  docker compose up -d --build     Oberfläche: http://SERVER:8099
# Beschreibung aller Einstellungen: STANDALONE.md
services:
  itelex-vermittlung:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    image: itelex-vermittlung:local
    container_name: itelex-vermittlung
    restart: unless-stopped
    # Host-Netz: Der Server muss die echte IP der Anrufer sehen (dynamische IP, Vermittlung).
    # Belegt die Ports 11811 (Verzeichnis), 49491 (Vermittlung) und 8099 (Oberfläche).
    network_mode: host
    environment:
      ITELEX_PUBLIC_HOST: ""              # DynDNS-Name oder öffentliche IPv4 der Vermittlung
      ITELEX_PUBLIC_PORT: "49491"         # Port, den der Router auf 49491 weiterleitet
      ITELEX_LOCAL_HOST: ""               # IP des Servers im Heimnetz (Antwort an Stationen von dort)
      ITELEX_FORWARD: "true"              # unbekannte Nummern im öffentlichen Netz nachschlagen
      ITELEX_SERVER_PIN: ""               # Server-PIN der i-Telex-Admins = voller Abgleich
      ITELEX_SYNC_SERVERS: ""             # Partnerserver (leer = öffentliche Teilnehmerserver)
      ITELEX_PHONEBOOK_HOURS: "6"         # Telefonbuch-Spiegel ohne Server-PIN
      ITELEX_ADMIN_PASSWORD: ""           # leer = wird erzeugt, steht in data/admin-passwort.txt
      ITELEX_LOG: "info"
    volumes:
      - ./data:/data
