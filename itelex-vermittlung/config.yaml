name: i-Telex-Vermittlung
version: "0.2.0"
slug: itelex_vermittlung
description: Eigenes i-Telex-Teilnehmerverzeichnis mit Vermittlung, Telefonbuch, Rufumleitung und Abgleich
url: https://github.com/spliter90/ha-itelex
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-classic
panel_title: Vermittlung
homeassistant_api: true
ports:
  11811/tcp: 11811
  49491/tcp: 49491
ports_description:
  11811/tcp: Teilnehmerverzeichnis (im Router weiterleiten)
  49491/tcp: Vermittlung (im Router weiterleiten)
options:
  oeffentliche_adresse: ""
  vermittlung_port_extern: 49491
  unbekannte_nummern_weiterleiten: true
  protokoll: info
  oeffentliche_teilnehmerserver:
    - tlnserv.teleprinter.net
    - tlnserv2.teleprinter.net
    - tlnserv3.teleprinter.net
  server_pin: ""
  abgleich_server: []
  telefonbuch_stunden: 6
schema:
  oeffentliche_adresse: str
  vermittlung_port_extern: port
  unbekannte_nummern_weiterleiten: bool
  protokoll: list(info|debug|warning)
  oeffentliche_teilnehmerserver:
    - str
  server_pin: str?
  abgleich_server:
    - str
  telefonbuch_stunden: int(1,48)
