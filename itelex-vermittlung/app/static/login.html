<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telex-Vermittlung</title>
<style>
:root {
  --bg: #efeae0; --paper: #fbf8f1; --paper-2: #f4efe4; --ink: #24211c; --ink-2: #6b645a;
  --line: #ddd5c6; --accent: #b4441f; --accent-ink: #fff; --err: #b3261e;
  --mono: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171614; --paper: #22201d; --paper-2: #1c1b18; --ink: #ece6da; --ink-2: #a39b8e;
          --line: #3a3631; --accent: #e0703f; --accent-ink: #1a1410; --err: #ff8a80; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
       background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
form { width: 100%; max-width: 340px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; }
.brand { font: 600 18px/1 var(--mono); letter-spacing: .14em; margin-bottom: 4px; }
.sub { color: var(--ink-2); font-size: 13px; margin-bottom: 18px; }
label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-2); color: inherit; font: inherit; }
button { margin-top: 14px; width: 100%; border: 0; background: var(--accent); color: var(--accent-ink); padding: 10px; border-radius: 8px; font: 600 15px var(--sans); cursor: pointer; }
.err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <div class="brand">VERMITTLUNG</div>
  <div class="sub">i-Telex · Verwaltung</div>
  <label for="pw">Passwort</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus required>
  <button type="submit">Anmelden</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) location.href = "./"; else err.textContent = d.error || "Anmeldung fehlgeschlagen";
  } catch (x) { err.textContent = "Server nicht erreichbar"; }
};
</script>
</body>
</html>
