configuration:
  oeffentliche_adresse:
    name: Public address
    description: Hostname or IPv4 where the exchange is reachable from the internet (e.g. the router's DynDNS name). Given to callers for stations connected via the exchange. For home use only, the internal IP of Home Assistant is enough.
  lokale_adresse:
    name: Address in the home network
    description: Internal IP of Home Assistant (e.g. 192.168.88.15). Stations in the home network then get this address for groups, services and stations connected via the exchange – without going through the router.
  vermittlung_port_extern:
    name: Public exchange port
    description: Port the router forwards to port 49491 of this add-on.
  unbekannte_nummern_weiterleiten:
    name: Look up unknown numbers in the public network
    description: Asks the public i-Telex directory when a number is not listed here, so your stations still reach the whole network.
  protokoll:
    name: Log level
    description: "debug writes more details to the add-on log."
  oeffentliche_teilnehmerserver:
    name: Public subscriber servers
    description: Queried in order.
  server_pin:
    name: Server PIN
    description: PIN issued by the i-Telex admins for syncing with the other subscriber servers. Leave empty without such an agreement – the public directory is then only mirrored as a phone book.
  abgleich_server:
    name: Sync servers
    description: Partner servers for syncing (host or host:port). Empty = the public subscriber servers.
  telefonbuch_stunden:
    name: Refresh phone book (hours)
    description: How often the public directory is mirrored without a server PIN.
network:
  11811/tcp: Subscriber directory
  49491/tcp: Exchange
