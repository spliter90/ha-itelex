# Nach /config/packages/itelex.yaml kopieren und in configuration.yaml aktivieren:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Hostname des Add-ons (steht auf der Add-on-Infoseite unter "Hostname"):
#   - aus dem Repository github.com/spliter90/ha-itelex:  ac8f73d1-itelex
#   - lokal installiert (Ordner /addons):                local-itelex

rest_command:
  itelex_senden:
    url: "http://ac8f73d1-itelex:8099/api/send"
    method: POST
    content_type: "application/json"
    payload: '{"to": {{ to | tojson }}, "text": {{ text | tojson }}}'

  itelex_anrufbeantworter:
    url: "http://ac8f73d1-itelex:8099/api/anrufbeantworter"
    method: POST
    content_type: "application/json"
    payload: '{"on": {{ an | tojson }}}'

# Schalter für Dashboard und Assist ("Schalte Telex Anrufbeantworter ein")
template:
  - switch:
      - name: "Telex Anrufbeantworter"
        unique_id: itelex_anrufbeantworter_schalter
        icon: mdi:voicemail
        state: "{{ is_state('binary_sensor.itelex_anrufbeantworter', 'on') }}"
        availability: "{{ states('binary_sensor.itelex_anrufbeantworter') in ['on', 'off'] }}"
        turn_on:
          - action: rest_command.itelex_anrufbeantworter
            data:
              an: true
        turn_off:
          - action: rest_command.itelex_anrufbeantworter
            data:
              an: false

intent_script:
  ItelexSenden:
    action:
      - action: rest_command.itelex_senden
        data:
          to: "{{ empfaenger }}"
          text: "{{ nachricht }}"
    speech:
      text: "Telex an {{ empfaenger }} ist unterwegs."

  ItelexLetzte:
    speech:
      text: >
        {{ state_attr('sensor.itelex_letzte_nachricht', 'vorlesen')
           or 'Es ist noch kein Telex angekommen.' }}

  ItelexAnrufbeantworter:
    action:
      - action: "switch.turn_{{ 'on' if zustand == 'on' else 'off' }}"
        target:
          entity_id: switch.telex_anrufbeantworter
    speech:
      text: "Der Telex-Anrufbeantworter ist {{ 'eingeschaltet' if zustand == 'on' else 'ausgeschaltet' }}."

  ItelexAnrufbeantworterStatus:
    speech:
      text: >
        {% if is_state('binary_sensor.itelex_anrufbeantworter', 'on') %}Der Telex-Anrufbeantworter ist an
        {%- set aus = state_attr('binary_sensor.itelex_anrufbeantworter', 'automatisch_aus') %}
        {%- if aus %} und schaltet sich am {{ aus }} aus{% endif %}.
        {% else %}Der Telex-Anrufbeantworter ist aus.{% endif %}

  ItelexUngelesen:
    speech:
      text: >
        {% set n = states('sensor.itelex_ungelesen') | int(0) %}
        {% if n == 0 %}Keine neuen Telexe.
        {% elif n == 1 %}Du hast ein neues Telex.
        {% else %}Du hast {{ n }} neue Telexe.{% endif %}

automation:
  - id: itelex_benachrichtigung
    alias: "Telex: Benachrichtigung bei neuer Nachricht"
    triggers:
      - trigger: event
        event_type: itelex_nachricht
    actions:
      - action: persistent_notification.create
        data:
          title: >-
            {{ 'Anrufbeantworter: ' if trigger.event.data.anrufbeantworter else '' }}Telex von
            {{ trigger.event.data.kennung or trigger.event.data.absender }}
          message: "{{ trigger.event.data.text }}"
      # Für Push aufs Handy z. B. ersetzen durch:
      # - action: notify.mobile_app_DEIN_HANDY
      #   data:
      #     title: "Telex von {{ trigger.event.data.kennung or trigger.event.data.absender }}"
      #     message: "{{ trigger.event.data.text[:200] }}"

  - id: itelex_fehler
    alias: "Telex: Meldung bei fehlgeschlagenem Versand"
    triggers:
      - trigger: event
        event_type: itelex_gesendet
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.status == 'failed' }}"
    actions:
      - action: persistent_notification.create
        data:
          title: "Telex an {{ trigger.event.data.empfaenger }} fehlgeschlagen"
          message: "{{ trigger.event.data.detail }}"
